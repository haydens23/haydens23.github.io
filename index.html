<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hayden Selvakumar</title>
<meta name="description" content="Hayden Selvakumar — UCLA Cognitive Science (Computing), Accenture Management Consulting Summer Analyst, aspiring product manager. Open to PM, strategy, and BizOps roles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#4285F4;
    --red:#EA4335;
    --yellow:#FBBC05;
    --green:#34A853;
    --link:#1a0dab;
    --visited:#681da8;
    --text:#202124;
    --muted:#4d5156;
    --meta:#70757a;
    --line:#dadce0;
    --hover:#f8f9fa;
    --chip:#f1f3f4;
    --font: "Google Sans Text", Roboto, arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--text);
    background:#fff;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  button{font-family:inherit}

  /* ---------- shared header links ---------- */
  .toplinks{
    position:absolute;top:0;right:0;
    display:flex;align-items:center;gap:16px;
    padding:16px 22px;font-size:13px;z-index:5;
  }
  .toplinks a{color:var(--text);text-decoration:none}
  .toplinks a:hover{text-decoration:underline}
  .avatar{
    width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,#4285F4,#34A853);
    color:#fff;display:grid;place-items:center;
    font-weight:500;font-size:14px;text-decoration:none;
  }
  .grid-icon{
    width:36px;height:36px;border-radius:50%;border:0;background:transparent;
    display:grid;place-items:center;cursor:pointer;
  }
  .grid-icon:hover{background:var(--chip)}
  .grid-icon span{
    display:grid;grid-template-columns:repeat(3,3px);gap:3px;
  }
  .grid-icon i{width:3px;height:3px;background:#5f6368;border-radius:50%;display:block}

  /* ---------- home ---------- */
  #home{
    min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:0 20px 12vh;
  }
  .wordmark{
    font-family:var(--font);
    font-weight:500;
    letter-spacing:-3px;
    font-size:clamp(44px,9vw,92px);
    margin:0 0 30px;
    line-height:1;
    text-align:center;
  }
  .wordmark span{display:inline-block}
  .c1{color:var(--blue)} .c2{color:var(--red)} .c3{color:var(--yellow)} .c4{color:var(--green)}
  .searchwrap{width:min(584px,100%);position:relative}
  .searchbar{
    display:flex;align-items:center;gap:12px;
    height:48px;padding:0 16px;
    border:1px solid var(--line);border-radius:24px;
    background:#fff;transition:box-shadow .15s, border-color .15s;
  }
  .searchbar:hover,.searchbar:focus-within{
    box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent;
  }
  .searchbar input{
    flex:1;border:0;outline:0;font-size:16px;color:var(--text);
    background:transparent;min-width:0;
  }
  .icnbtn{border:0;background:transparent;cursor:pointer;padding:4px;display:grid;place-items:center;border-radius:50%}
  .icnbtn:hover{background:var(--chip)}
  .homebtns{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
  .gbtn{
    background:var(--chip);border:1px solid transparent;border-radius:4px;
    color:#3c4043;font-size:14px;padding:0 18px;height:36px;cursor:pointer;
  }
  .gbtn:hover{border-color:#dadce0;box-shadow:0 1px 1px rgba(0,0,0,.1);background:#f8f9fa}
  .quick{
    display:flex;gap:clamp(14px,4vw,34px);justify-content:center;
    margin-top:44px;flex-wrap:wrap;
  }
  .quick button{
    border:0;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-size:12px;color:#3c4043;width:64px;
  }
  .quick .bubble{
    width:48px;height:48px;border-radius:50%;background:var(--chip);
    display:grid;place-items:center;transition:background .15s, transform .15s;
  }
  .quick button:hover .bubble{background:#e8eaed;transform:translateY(-2px)}
  .tagline{margin-top:52px;font-size:13px;color:var(--meta);text-align:center}

  /* ---------- suggestions ---------- */
  .suggest{
    position:absolute;top:0;left:0;right:0;
    background:#fff;border:1px solid transparent;border-radius:24px;
    box-shadow:0 1px 6px rgba(32,33,36,.28);
    padding-top:48px;overflow:hidden;display:none;z-index:4;
  }
  .suggest.open{display:block}
  .suggest .row{
    display:flex;align-items:center;gap:14px;
    padding:8px 18px;font-size:15px;cursor:pointer;color:#202124;
  }
  .suggest .row:hover,.suggest .row.active{background:#f1f3f4}
  .suggest .divider{height:1px;background:#e8eaed;margin:6px 0 0}

  /* ---------- results ---------- */
  #results{display:none}
  #results.on{display:block}
  .resbar{
    border-bottom:1px solid #ebebeb;padding:20px 20px 0;
    position:sticky;top:0;background:#fff;z-index:6;
  }
  .resbar-top{display:flex;align-items:center;gap:24px}
  .minilogo{
    font-size:26px;font-weight:500;letter-spacing:-1.5px;cursor:pointer;
    border:0;background:transparent;padding:0;flex-shrink:0;
  }
  .resbar .searchwrap{max-width:640px;flex:1}
  .resbar .searchbar{height:44px}
  .tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    border:0;background:transparent;cursor:pointer;
    padding:0 12px 12px;font-size:14px;color:#5f6368;white-space:nowrap;
    border-bottom:3px solid transparent;margin-bottom:-1px;
  }
  .tab:hover{color:#202124}
  .tab.on{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:500}

  .layout{
    display:grid;grid-template-columns:minmax(0,652px) minmax(0,372px);
    gap:44px;padding:16px 20px 80px;
    max-width:1120px;margin-left:clamp(0px,10vw,180px);
  }
  .stat{font-size:12px;color:var(--meta);margin:6px 0 18px}

  .ai{
    border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:26px;
    background:linear-gradient(180deg,#f8fbff,#fff 60%);
  }
  .ai h3{
    margin:0 0 12px;font-size:15px;font-weight:500;color:#1f1f1f;
    display:flex;align-items:center;gap:8px;
  }
  .ai p{margin:0 0 12px;font-size:15px;line-height:1.6;color:#1f1f1f}
  .ai ul{margin:0;padding-left:20px}
  .ai li{font-size:14px;line-height:1.65;margin-bottom:7px;color:#1f1f1f}
  .ai .kf{font-size:14px;font-weight:700;margin:14px 0 8px}
  .ai .disclaimer{font-size:11px;color:var(--meta);margin:12px 0 0}
  .ai a{color:var(--link);text-decoration:none}
  .ai a:hover{text-decoration:underline}

  .result{margin-bottom:28px}
  .result .crumbs{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .favicon{
    width:26px;height:26px;border-radius:50%;background:var(--chip);
    display:grid;place-items:center;font-size:12px;font-weight:700;color:#5f6368;flex-shrink:0;
  }
  .crumbs .site{font-size:14px;line-height:1.2}
  .crumbs .site b{display:block;font-weight:400;color:#202124}
  .crumbs .site span{font-size:12px;color:var(--muted)}
  .result h4{margin:0;font-size:20px;font-weight:400;line-height:1.3}
  .result h4 button{
    border:0;background:transparent;padding:0;cursor:pointer;
    font:inherit;color:var(--link);text-align:left;
  }
  .result h4 button:hover{text-decoration:underline}
  .result.seen h4 button{color:var(--visited)}
  .result p{margin:4px 0 0;font-size:14px;line-height:1.58;color:var(--muted)}
  .result p b{color:#202124;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{
    font-size:12px;background:var(--chip);color:#3c4043;
    padding:4px 10px;border-radius:12px;
  }

  /* people also ask */
  .paa{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin:0 0 28px}
  .paa h3{font-size:20px;font-weight:400;margin:10px 0 6px}
  .paa details{border-bottom:1px solid #ececec;padding:2px 0}
  .paa details:last-of-type{border-bottom:0}
  .paa summary{
    list-style:none;cursor:pointer;padding:14px 2px;font-size:15px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .paa summary::-webkit-details-marker{display:none}
  .paa summary::after{content:"⌄";color:#70757a;font-size:16px;transition:transform .2s;margin-top:-6px}
  .paa details[open] summary::after{transform:rotate(180deg);margin-top:2px}
  .paa .ans{font-size:14px;line-height:1.6;color:var(--muted);padding:0 2px 16px}

  /* knowledge panel */
  .kp{position:sticky;top:118px;align-self:start}
  .kp-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .kp-photo{
    aspect-ratio:1/1;background:linear-gradient(135deg,#4285F4,#34A853 45%,#FBBC05 80%,#EA4335);
    background-size:cover;background-position:center top;
    display:grid;place-items:center;color:#fff;font-size:72px;font-weight:500;letter-spacing:-2px;
  }
  .kp-body{padding:18px 20px 20px}
  .kp-body h2{margin:0;font-size:24px;font-weight:400}
  .kp-body .sub{font-size:13px;color:var(--meta);margin:2px 0 14px}
  .kp-row{font-size:13px;line-height:1.6;color:var(--muted);padding:8px 0;border-top:1px solid #f0f0f0}
  .kp-row b{color:#202124;font-weight:700}
  .kp-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .kp-actions a,.kp-actions button{
    font-size:13px;color:#1a73e8;border:1px solid var(--line);border-radius:16px;
    padding:6px 14px;text-decoration:none;background:#fff;cursor:pointer;
  }
  .kp-actions a:hover,.kp-actions button:hover{background:#f8faff;border-color:#1a73e8}

  .sitelinks{border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .sitelink{
    display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #f1f1f1;
    cursor:pointer;text-decoration:none;color:inherit;
  }
  .sitelink:last-child{border-bottom:0}
  .sitelink:hover{background:var(--hover)}
  .sitelink .meta{font-size:12px;color:var(--meta)}
  .sitelink .ttl{font-size:14px;margin:2px 0 3px}
  .sitelink .desc{font-size:12px;color:var(--muted);line-height:1.5}


  /* ---------- case study modal ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(32,33,36,.5);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:50;
  }
  .scrim.on{opacity:1;pointer-events:auto}
  .modal{
    position:fixed;inset:0;z-index:51;display:grid;place-items:center;
    padding:20px;pointer-events:none;
  }
  .modal-card{
    width:min(880px,100%);max-height:88dvh;overflow-y:auto;background:#fff;
    border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.28);pointer-events:auto;
    opacity:0;transform:translateY(28px) scale(.965);
    transition:opacity .34s cubic-bezier(.2,.8,.2,1), transform .34s cubic-bezier(.2,.8,.2,1);
  }
  .modal.on .modal-card{opacity:1;transform:none}
  .modal-head{
    position:sticky;top:0;background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:22px 28px 16px;border-bottom:1px solid var(--line);z-index:2;
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  }
  .modal-head h2{margin:0;font-size:24px;font-weight:400;line-height:1.25}
  .modal-head .kicker{font-size:12px;color:var(--meta);margin-bottom:5px}
  .modal-close{
    border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;
    cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:background .15s,transform .15s;
  }
  .modal-close:hover{background:#e3e6e8;transform:rotate(90deg)}
  .modal-body{padding:24px 28px 30px}
  .modal-body p{font-size:15px;line-height:1.68;color:var(--muted);margin:0 0 16px}
  .modal-body p b{color:#202124}
  .modal-body h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);margin:26px 0 12px;font-weight:500}
  .modal-body ul{margin:0 0 16px;padding-left:20px}
  .modal-body li{font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:8px}
  .modal-body li b{color:#202124}

  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:4px 0 8px}
  .gallery figure{margin:0}
  .gallery img{
    display:block;width:100%;border-radius:14px;border:1px solid var(--line);
    cursor:zoom-in;background:#fafafa;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
  }
  .gallery img:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 16px 34px rgba(0,0,0,.16)}
  .gallery figcaption{font-size:12px;color:var(--meta);margin-top:9px;line-height:1.5}

  .rise{opacity:0;transform:translateY(16px);animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  .lightbox{
    position:fixed;inset:0;z-index:60;background:rgba(20,20,22,.9);
    display:grid;place-items:center;padding:32px;cursor:zoom-out;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .lightbox.on{opacity:1;pointer-events:auto}
  .lightbox img{
    max-width:100%;max-height:100%;border-radius:12px;
    transform:scale(.93);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .lightbox.on img{transform:none}

  .expand-hint{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#1a73e8;
    margin-top:9px;
  }

  @media (max-width:640px){
    .gallery{grid-template-columns:1fr}
    .modal-head{padding:18px 18px 14px}
    .modal-body{padding:20px 18px 26px}
    .modal-card{max-height:92dvh;border-radius:14px}
  }
  .footer{
    border-top:1px solid var(--line);padding:14px 24px;font-size:13px;
    color:var(--meta);display:flex;gap:20px;flex-wrap:wrap;
  }
  .footer a{color:var(--meta);text-decoration:none}
  .footer a:hover{text-decoration:underline}

  .noresults{font-size:15px;line-height:1.7;color:var(--muted);margin-bottom:28px}
  .noresults b{color:#202124}

  @media (max-width:1000px){
    .layout{grid-template-columns:minmax(0,1fr);margin-left:0;gap:0}
    .kp{position:static;margin-top:8px}
    .resbar-top{gap:14px}
  }
  @media (max-width:520px){
    .toplinks{gap:10px;padding:12px}
    .toplinks a.hide-sm{display:none}
    .minilogo{font-size:22px}
    .layout{padding:14px 16px 60px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
  .fade{animation:fade .28s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

/* --- scoring --- */
function score(item,q){
  if(!q) return 1;
  const words=q.toLowerCase().replace(/[^\w\s']/g," ").split(/\s+/).filter(w=>w.length>1);
  const hay=(item.title+" "+item.body+" "+item.keys+" "+item.tab).toLowerCase();
  let s=0;
  words.forEach(w=>{
    if(item.keys.includes(w)) s+=3;
    if(item.title.toLowerCase().includes(w)) s+=2;
    if(hay.includes(w)) s+=1;
  });
  return s;
}
function bestTab(q){
  const scored=RESULTS.map(r=>({r,s:score(r,q)})).sort((a,b)=>b.s-a.s);
  return scored[0].s>0 ? scored[0].r.tab : null;
}

}

function openDetail(path){

      </button>
    </div>

        ${d.gallery.map(g=>`<figure class="rise" ${delay()}>

}
function closeDetail(){
  scrim.classList.remove("on"); modal.classList.remove("on");

  if(lastFocus) lastFocus.focus();
}

/* --- home search + suggestions --- */
const homeInput=document.getElementById("homeInput");
const suggestBox=document.getElementById("suggest");
let sIdx=-1, sList=[];

function openSuggest(){
  const q=homeInput.value.toLowerCase().trim();
  sList = q ? SUGGESTIONS.filter(s=>s.includes(q)).concat(SUGGESTIONS.filter(s=>!s.includes(q))).slice(0,6) : SUGGESTIONS;
  suggestBox.innerHTML=`<div class="divider"></div>`+sList.map((s,i)=>
    `<div class="row" data-i="${i}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>${s}</div>`
  ).join("")+`<div style="height:8px"></div>`;
  suggestBox.classList.add("open");
  suggestBox.querySelectorAll(".row").forEach(r=>r.onmousedown=e=>{e.preventDefault(); openResults(sList[+r.dataset.i],"All");});
}
function closeSuggest(){ suggestBox.classList.remove("open"); sIdx=-1; }

homeInput.addEventListener("focus",openSuggest);
homeInput.addEventListener("input",()=>{
  document.getElementById("clearHome").style.display=homeInput.value?"grid":"none";
  openSuggest();
});
homeInput.addEventListener("blur",()=>setTimeout(closeSuggest,120));
homeInput.addEventListener("keydown",e=>{
  const rows=[...suggestBox.querySelectorAll(".row")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    sIdx=(sIdx+(e.key==="ArrowDown"?1:-1)+rows.length)%rows.length;
    rows.forEach((r,i)=>r.classList.toggle("active",i===sIdx));
    homeInput.value=sList[sIdx];
  }else if(e.key==="Enter"){
    openResults(homeInput.value.trim(),"All");
  }else if(e.key==="Escape"){ closeSuggest(); }
});
document.getElementById("clearHome").onclick=()=>{homeInput.value="";homeInput.focus();document.getElementById("clearHome").style.display="none";};
document.getElementById("searchBtn").onclick=()=>openResults(homeInput.value.trim(),"All");
